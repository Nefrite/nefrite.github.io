<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm Prototype - Fáze 7</title>
    <style>
        body {
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #d4d4d4;
            font-family: sans-serif;
        }
        #game-container {
            position: relative;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 700;
            color: #fb923c;
        }
        canvas {
            border: 2px solid #555;
            background-color: #2b2b2b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 95vw;
            max-height: 80vh;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Worm Proto - Fáze 7 (Cíl: mrkev, časomíra)</h1>
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
        <div class="controls">
            Hráč 1: <b>Šipky VLEVO / VPRAVO</b> · Hráč 2: <b>A / D</b> (v režimu 1 hráče fungují obě) ·
            <b>R</b> restart · <b>N</b> nová mapa · <b>1 / 2</b> počet hráčů · URL: <code>?seed=123&amp;players=2</code>
        </div>
    </div>

    <script>
        // =====================================================================
        // ===== 1. CONFIG =====================================================
        // =====================================================================
        // Všechny rychlosti, tempa a růst jsou v jednotkách ZA SEKUNDU.
        // Simulace běží s fixním krokem 60 Hz, takže hodnoty odpovídají
        // původním hodnotám "za frame" × 60 (Fáze 5 se chová stejně).
        const CONFIG = {
            sim:   { hz: 60, maxFrameTime: 0.25 },          // maxFrameTime: ochrana po přepnutí záložky (s)
            view:  { width: 1600, height: 900, cameraTrigger: 0.75 },
            world: { width: 16000, height: 900 },
            colors: {
                dirt: '#3E2723',          // nevykopáno
                path: '#D7CCC8',          // vykopaná cesta
                root: '#8D6E63',          // kořeny
                stoneTerrain: '#261714',  // stopa kamene v terénu
            },
            players: { count: 1, startX: 100, spacingY: 240 },
            // Velikostní kategorie – společné pro červa i brouky (stejná kategorie = stejný rádius).
            // Rádius = baseRadius × size. Červ: kat. 1–4, brouci: kat. 1–5.
            tiers: {
                baseRadius: 25,
                sizes: [0.25, 0.50, 0.75, 1.00, 1.25],
            },
            worm: {
                // Rádius roste plynule od rádiusu kat. start do rádiusu kat. max;
                // kategorie (pro pravidla) = nejvyšší, jejíž rádius červ už dosáhl → skáče po stupních.
                tier: { start: 0, max: 3 },                  // 0-based index do tiers.sizes (kat. 1 → kat. 4)
                length: { start: 75, max: 300 },             // px, roste úměrně rádiusu
                speed:  { dirt: 101.25, tunnel: 168.75 },  // px/s  (1.6875 / 2.8125 px/frame)
                sizeSpeedBonus: 0.5,                         // na max. velikosti ×1.5
                rootSlow: 0.25,                              // rychlost v kořeni = 25 % základní
                turnRate: 3,                                 // rad/s (0.05 rad/frame)
                wave: { freq: 12, amp: 0.15, turnDamp: 0.2 },// freq rad/s (0.2/frame)
                growth: { radius: 2 },                       // px/s při žraní kořene → 6,25 → 25 za ≈ 9,4 s (≈ 3,1 s na kategorii)
                digExtra: 2,                                 // tunel = radius + 2
                sampling: { count: 5, spread: Math.PI / 4, ahead: 5 },
                neckProtection: 3.5,                         // × radius
                selfHitDist: 1.8,                            // × radius
            },
            bug: {
                count: 60,
                spawnMinX: 500,
                // Vzhled podle kategorie (CONFIG.tiers): čím větší, tím tmavší = tím nebezpečnější.
                tierLooks: [
                    { color: '#D2B48C', eye: '#000000' },   // 1 –  6,25 px
                    { color: '#A9744F', eye: '#000000' },   // 2 – 12,5 px
                    { color: '#7A4A2E', eye: '#000000' },   // 3 – 18,75 px
                    { color: '#4E2A1C', eye: '#E0C080' },   // 4 – 25 px (= max. červ)
                    { color: '#21100B', eye: '#FF5030' },   // 5 – 31,25 px
                ],
                tierByProgress: true,                        // true: vyšší kategorie se odemykají s postupem mapou
                speed:  { dirt: 100.8, tunnel: 168 },        // px/s  (1.68 / 2.8 px/frame)
                wakeDistance: 300,                           // px za pravým okrajem obrazovky
                turn: {
                    chancePerSec: 3.08,                      // ≈ 5 %/frame při 60 Hz  (−ln(0.95)·60)
                    duration: [1 / 3, 4 / 3],                // s  (20–80 framů)
                    maxRate: 3,                              // rad/s (±0.05 rad/frame)
                },
                walkAnim: 15,                                // rad/s (0.25/frame)
                digExtra: 1,
                sampling: { count: 3, spread: Math.PI / 4, ahead: 5 },
            },
            // Střety červ ↔ brouk podle kategorií.
            // Brouk se dotkne hlavy = červ narazil do brouka; dotkne se těla = brouk narazil do červa.
            clash: {
                eatGrowChance: [0.4, 0.7, 1.0],              // šance na růst (jinak zrychlení) podle rozdílu kat. 1/2/3
                eatGrowth: 0.25,                             // růst = 0.25 × rádius sežraného brouka
                boost: { factor: 1.4, duration: 2 },         // × rychlost, s
                slow:  { factor: 0.5, duration: 1 },         // × rychlost, s
                wormStun: 1.5,                               // s – úplné zastavení
                bugStun: 2,                                  // s
                bite: 0.5,                                   // zmenšení = 0.5 × krok kategorie (6,25 px)
                pairCooldown: 1,                             // s – dvojice červ–brouk po střetu
                wormImmuneAfterStun: 1,                      // s – po omráčení (proti stun-locku)
            },
            // Cíl: zakousnutí hlavy do mrkve na konci mapy ukončí závod.
            finish: {
                countdown: 3,                                // s – odpočet před startem, vše stojí
                carrot: { x: 15800, rx: 18, ry: 55, marginY: 90, attempts: 20 },  // svislá elipsa (hitbox), výška náhodná podle seedu
                stoneClearance: 20,                          // px – mrkev se nekryje s kamenem
                confetti: 120,
            },
            stones: { count: 500, maxAreaRatio: 0.20, rx: [15, 45], ry: [10, 30], safeRadius: 150, maxAttempts: 10 },
            roots:  { systems: 60, marginX: 400, radius: [20, 40], segments: [20, 50], shrink: 0.90, minRadius: 3, stepY: 0.8 },
        };

        const WORLD_WIDTH = CONFIG.world.width;
        const WORLD_HEIGHT = CONFIG.world.height;

        const PLAYER_COLORS = [
            { head: '#6d1818', body: '#380608' },   // hráč 1 – červený
            { head: '#1b4f72', body: '#0b2236' },   // hráč 2 – modrý
        ];

        // =====================================================================
        // ===== 2. UTIL (rng, math) ===========================================
        // =====================================================================
        // Seedovaný PRNG – stejný seed = stejná mapa.
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function randRange(rng, range) {
            return range[0] + rng() * (range[1] - range[0]);
        }

        // Rádius velikostní kategorie (0-based index)
        function tierRadius(tier) {
            return CONFIG.tiers.baseRadius * CONFIG.tiers.sizes[tier];
        }

        // Nejvyšší kategorie, jejíž rádius je ≤ radius (min. 0)
        function tierForRadius(radius) {
            const sizes = CONFIG.tiers.sizes;
            let tier = 0;
            for (let i = 0; i < sizes.length; i++) {
                if (radius + 1e-6 >= tierRadius(i)) tier = i;
            }
            return tier;
        }

        function newRandomSeed() {
            return Math.floor(Math.random() * 1e9) + 1;
        }

        // =====================================================================
        // ===== 3. INPUT ======================================================
        // =====================================================================
        // e.code = fyzická klávesa (nezávislé na CZ rozložení a CapsLocku).
        const CONTROLS = [
            { left: ['ArrowLeft'], right: ['ArrowRight'] },   // hráč 1
            { left: ['KeyA'],      right: ['KeyD'] },         // hráč 2
        ];
        const SOLO_CONTROLS = { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'] };

        const pressedKeys = new Set();

        window.addEventListener('keydown', (e) => {
            if (e.code.startsWith('Arrow')) e.preventDefault();
            if (!e.repeat) handleActionKey(e.code);
            pressedKeys.add(e.code);
        });
        window.addEventListener('keyup', (e) => pressedKeys.delete(e.code));
        window.addEventListener('blur', () => pressedKeys.clear());

        function readInput(map) {
            return {
                left:  map.left.some(k => pressedKeys.has(k)),
                right: map.right.some(k => pressedKeys.has(k)),
            };
        }

        function getControlsFor(playerIndex, playerCount) {
            return playerCount === 1 ? SOLO_CONTROLS : CONTROLS[playerIndex];
        }

        // =====================================================================
        // ===== 4. WORLD (terén, kameny, kořeny, generování) ==================
        // =====================================================================
        const canvas = document.getElementById('gameCanvas');
        canvas.width = CONFIG.view.width;
        canvas.height = CONFIG.view.height;
        const ctx = canvas.getContext('2d');

        // Offscreen canvas pro uchování "vykopaného" terénu pro celý svět
        const terrainCanvas = document.createElement('canvas');
        terrainCanvas.width = WORLD_WIDTH;
        terrainCanvas.height = WORLD_HEIGHT;
        const tCtx = terrainCanvas.getContext('2d', { willReadFrequently: true });

        const stones = [];
        const rootsData = [];

        function clearTerrain() {
            tCtx.fillStyle = CONFIG.colors.dirt;
            tCtx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
        }

        function isPathColor(r, g, b) {
            return (r > 200 && g > 190 && b > 190);
        }

        function isRootColor(r, g, b) {
            return (r > 120 && r < 160 && g > 90 && g < 130 && b > 80 && b < 120);
        }

        function digTunnel(x, y, radius) {
            tCtx.fillStyle = CONFIG.colors.path;
            tCtx.beginPath();
            tCtx.arc(x, y, radius, 0, Math.PI * 2);
            tCtx.fill();
        }

        // safePoints: body, kolem kterých se nesmí generovat kameny (starty hráčů)
        function initStones(rng, safePoints) {
            const cfg = CONFIG.stones;
            stones.length = 0;
            const maxTotalArea = WORLD_WIDTH * WORLD_HEIGHT * cfg.maxAreaRatio;
            let currentTotalArea = 0;

            for (let i = 0; i < cfg.count; i++) {
                const rx = randRange(rng, cfg.rx);
                const ry = randRange(rng, cfg.ry);
                const stoneArea = Math.PI * rx * ry;

                if (currentTotalArea + stoneArea > maxTotalArea) break;

                const rotation = rng() * Math.PI * 2;

                let x, y;
                let attempts = 0;
                let validPosition = false;

                do {
                    x = rng() * (WORLD_WIDTH - rx * 2) + rx;
                    y = rng() * (WORLD_HEIGHT - ry * 2) + ry;
                    attempts++;
                    validPosition = safePoints.every(p => Math.hypot(x - p.x, y - p.y) > cfg.safeRadius);
                } while (!validPosition && attempts < cfg.maxAttempts);

                if (validPosition) {
                    stones.push({ x, y, rx, ry, rotation });
                    currentTotalArea += stoneArea;

                    tCtx.fillStyle = CONFIG.colors.stoneTerrain;
                    tCtx.beginPath();
                    tCtx.ellipse(x, y, rx, ry, rotation, 0, Math.PI * 2);
                    tCtx.fill();
                }
            }
        }

        function initRoots(rng) {
            const cfg = CONFIG.roots;
            rootsData.length = 0;
            tCtx.fillStyle = CONFIG.colors.root;

            for (let r = 0; r < cfg.systems; r++) {
                const isBottomRoot = rng() > 0.5;

                const startX = cfg.marginX + rng() * (WORLD_WIDTH - cfg.marginX * 2);
                const startY = isBottomRoot ? WORLD_HEIGHT : 0;

                let currentX = startX;
                let currentY = startY;
                let currentRadius = randRange(rng, cfg.radius);

                const segmentsCount = randRange(rng, cfg.segments);
                const rootSegments = [];

                for (let s = 0; s < segmentsCount; s++) {
                    tCtx.beginPath();
                    tCtx.arc(currentX, currentY, currentRadius, 0, Math.PI * 2);
                    tCtx.fill();

                    rootSegments.push({ x: currentX, y: currentY, radius: currentRadius });

                    const yDirection = isBottomRoot ? -1 : 1;
                    currentY += (currentRadius * cfg.stepY) * yDirection;
                    currentX += (rng() - 0.5) * currentRadius * 2;

                    currentRadius *= cfg.shrink;

                    if (currentRadius < cfg.minRadius) break;
                }
                rootsData.push(rootSegments);
            }
        }

        function initBugs(rng) {
            const cfg = CONFIG.bug;
            game.bugs.length = 0;
            for (let i = 0; i < cfg.count; i++) {
                const x = cfg.spawnMinX + rng() * (WORLD_WIDTH - cfg.spawnMinX);
                const y = rng() * WORLD_HEIGHT;
                game.bugs.push(new Bug(x, y, rng));
            }
        }

        // Mrkev na náhodné výšce; generuje se až po broucích, aby se ostatní mapa pro seed nezměnila
        const carrot = { x: 0, y: 0, rx: 0, ry: 0, bite: null };

        function initCarrot(rng) {
            const cfg = CONFIG.finish.carrot;
            const clearance = CONFIG.finish.stoneClearance;
            carrot.x = cfg.x;
            carrot.rx = cfg.rx;
            carrot.ry = cfg.ry;
            carrot.bite = null;

            // Mrkev ≈ svislá úsečka s tloušťkou rx; kámen ≈ kruh s rádiusem max(rx, ry)
            const blocksCarrot = (s) => {
                const nearestY = Math.max(carrot.y - cfg.ry, Math.min(carrot.y + cfg.ry, s.y));
                return Math.hypot(s.x - carrot.x, s.y - nearestY) < Math.max(s.rx, s.ry) + cfg.rx + clearance;
            };
            for (let i = 0; i < cfg.attempts; i++) {
                carrot.y = cfg.marginY + rng() * (WORLD_HEIGHT - cfg.marginY * 2);
                if (!stones.some(blocksCarrot)) return;
            }

            // Volné místo se nenašlo (hustě kamenitý konec mapy) → kameny u mrkve odstranit i se stopou
            tCtx.fillStyle = CONFIG.colors.dirt;
            for (let i = stones.length - 1; i >= 0; i--) {
                const s = stones[i];
                if (!blocksCarrot(s)) continue;
                tCtx.beginPath();
                tCtx.ellipse(s.x, s.y, s.rx + 1, s.ry + 1, s.rotation, 0, Math.PI * 2);
                tCtx.fill();
                stones.splice(i, 1);
            }
        }

        // =====================================================================
        // ===== 5. ENTITIES (Worm, Bug) =======================================
        // =====================================================================
        class Worm {
            constructor(x, y, colors) {
                const cfg = CONFIG.worm;
                this.x = x;
                this.y = y;

                // Velikost roste plynule; kategorie (this.tier) se z ní odvozuje po skocích
                this.radius = tierRadius(cfg.tier.start);
                this.targetLength = cfg.length.start;

                this.angle = 0;
                this.waveAngle = 0;
                this.currentMoveAngle = this.angle;

                this.headColor = colors.head;
                this.color = colors.body;

                this.body = [];
                this.currentActualSpeed = 0;   // px/s – pro HUD

                // Stavové efekty ze střetů s brouky (zbývající čas v s)
                this.stunTime = 0;
                this.slowTime = 0;
                this.boostTime = 0;
                this.immuneTime = 0;
                this.stats = { eaten: 0, bitten: 0 };
            }

            get isStunned() {
                return this.stunTime > 0;
            }

            // Násobitel rychlosti ze stavových efektů
            get effectSpeedFactor() {
                const c = CONFIG.clash;
                if (this.isStunned) return 0;
                return (this.slowTime > 0 ? c.slow.factor : 1) * (this.boostTime > 0 ? c.boost.factor : 1);
            }

            stun() {
                const c = CONFIG.clash;
                this.stunTime = c.wormStun;
                this.immuneTime = c.wormStun + c.wormImmuneAfterStun;
            }

            tickEffects(dt) {
                this.stunTime = Math.max(0, this.stunTime - dt);
                this.slowTime = Math.max(0, this.slowTime - dt);
                this.boostTime = Math.max(0, this.boostTime - dt);
                this.immuneTime = Math.max(0, this.immuneTime - dt);
            }

            // 0 (startovní kategorie) … 1 (max. kategorie), plynule podle rádiusu
            get growthFactor() {
                const t = CONFIG.worm.tier;
                const r0 = tierRadius(t.start);
                const r1 = tierRadius(t.max);
                return (this.radius - r0) / (r1 - r0);
            }

            // Kategorie síly pro pravidla (0-based) – skáče po stupních
            get tier() {
                return Math.min(tierForRadius(this.radius), CONFIG.worm.tier.max);
            }

            get isMaxTier() {
                return this.tier >= CONFIG.worm.tier.max;
            }

            // Postup k další kategorii 0 … 1 (pro HUD)
            get tierProgress() {
                if (this.isMaxTier) return 1;
                const r0 = tierRadius(this.tier);
                const r1 = tierRadius(this.tier + 1);
                return (this.radius - r0) / (r1 - r0);
            }

            // Změna velikosti o deltaRadius px (záporná = zmenšení); délka těla úměrně
            grow(deltaRadius) {
                const cfg = CONFIG.worm;
                this.radius = Math.min(Math.max(this.radius + deltaRadius, tierRadius(cfg.tier.start)), tierRadius(cfg.tier.max));
                this.targetLength = cfg.length.start + (cfg.length.max - cfg.length.start) * this.growthFactor;
            }

            // px/s
            get currentBaseSpeed() {
                return CONFIG.worm.speed.dirt * (1 + this.growthFactor * CONFIG.worm.sizeSpeedBonus);
            }

            // px/s
            get currentBoostSpeed() {
                return CONFIG.worm.speed.tunnel * (1 + this.growthFactor * CONFIG.worm.sizeSpeedBonus);
            }

            checkBodyCollision() {
                const cfg = CONFIG.worm;
                const neckProtectionDist = this.radius * cfg.neckProtection;
                let currentBodyDist = 0;
                let collidedBodyPoint = null;

                for (let i = this.body.length - 1; i >= 0; i--) {
                    const segment = this.body[i];

                    if (i < this.body.length - 1) {
                        const prevSegment = this.body[i + 1];
                        currentBodyDist += Math.hypot(segment.x - prevSegment.x, segment.y - prevSegment.y);
                    }

                    if (currentBodyDist > neckProtectionDist) {
                        const distToHead = Math.hypot(this.x - segment.x, this.y - segment.y);
                        if (distToHead < this.radius * cfg.selfHitDist) {
                            collidedBodyPoint = segment;
                            break;
                        }
                    }
                }

                if (collidedBodyPoint) {
                    const nx = this.x - collidedBodyPoint.x;
                    const ny = this.y - collidedBodyPoint.y;

                    const collisionAngle = Math.atan2(ny, nx);
                    this.angle = collisionAngle;
                    this.currentMoveAngle = this.angle;

                    this.x += Math.cos(this.angle) * this.radius;
                    this.y += Math.sin(this.angle) * this.radius;
                }
            }

            // dt: s · input: { left, right } · minX: zadní zeď (levý okraj kamery)
            update(dt, input, minX) {
                const cfg = CONFIG.worm;
                this.tickEffects(dt);
                const stunned = this.isStunned;
                const prevX = this.x;
                const prevY = this.y;

                // Vzorkování před hlavou (vějíř −45° … +45° vůči směru pohybu)
                const s = cfg.sampling;
                const lookAheadDist = this.radius + s.ahead;
                let pathHitCount = 0;
                let inRoot = false;

                for (let i = 0; i < s.count; i++) {
                    const sampleAngleOffset = -s.spread + (s.spread * 2 * (i / (s.count - 1 || 1)));
                    const sampleAngle = this.currentMoveAngle + sampleAngleOffset;

                    const checkX = this.x + Math.cos(sampleAngle) * lookAheadDist;
                    const checkY = this.y + Math.sin(sampleAngle) * lookAheadDist;

                    if (checkX >= 0 && checkX < WORLD_WIDTH && checkY >= 0 && checkY < WORLD_HEIGHT) {
                        const pixel = tCtx.getImageData(checkX, checkY, 1, 1).data;
                        if (isPathColor(pixel[0], pixel[1], pixel[2])) {
                            pathHitCount++;
                        }
                        if (i === Math.floor(s.count / 2) && isRootColor(pixel[0], pixel[1], pixel[2])) {
                            inRoot = true;
                        }
                    }
                }

                // 0.0 (hlína) až 1.0 (čistá cesta)
                const pathPercentage = pathHitCount / s.count;

                let currentSpeed;   // px/s
                if (inRoot) {
                    currentSpeed = this.currentBaseSpeed * cfg.rootSlow;
                    if (!stunned) this.grow(cfg.growth.radius * dt);
                } else {
                    currentSpeed = this.currentBaseSpeed + (this.currentBoostSpeed - this.currentBaseSpeed) * pathPercentage;
                }
                currentSpeed *= this.effectSpeedFactor;
                this.currentActualSpeed = currentSpeed;

                digTunnel(this.x, this.y, this.radius + cfg.digExtra);

                // Omráčený červ nezatáčí ani se nevlní
                let isTurning = false;
                if (!stunned) {
                    if (input.left)  { this.angle -= cfg.turnRate * dt; isTurning = true; }
                    if (input.right) { this.angle += cfg.turnRate * dt; isTurning = true; }
                    this.waveAngle += cfg.wave.freq * dt;
                }
                const currentAmplitude = isTurning ? cfg.wave.amp * cfg.wave.turnDamp : cfg.wave.amp;
                this.currentMoveAngle = this.angle + Math.sin(this.waveAngle) * currentAmplitude;

                this.x += Math.cos(this.currentMoveAngle) * currentSpeed * dt;
                this.y += Math.sin(this.currentMoveAngle) * currentSpeed * dt;

                if (this.x > WORLD_WIDTH - this.radius) {
                    this.x = WORLD_WIDTH - this.radius;
                    this.angle = Math.PI - this.angle;
                }
                if (this.y < this.radius) { this.y = this.radius; this.angle = -this.angle; }
                if (this.y > WORLD_HEIGHT - this.radius) { this.y = WORLD_HEIGHT - this.radius; this.angle = -this.angle; }

                // Zadní zeď (levý okraj kamery)
                if (this.x < minX + this.radius) {
                    this.x = minX + this.radius;
                    if (!stunned) this.angle = Math.PI - this.angle;   // omráčeného jen posune
                }

                if (this.body.length > 0) {
                    this.checkBodyCollision();
                    bounceWormOffStones(this, dt);
                }

                // Bod těla jen při pohybu (omráčený červ by jinak hromadil body na místě)
                if (this.body.length === 0 || this.x !== prevX || this.y !== prevY) {
                    this.body.push({ x: this.x, y: this.y });
                }

                // Oříznutí těla na cílovou délku
                let currentPhysicalLength = 0;
                let cutIndex = -1;
                for (let i = this.body.length - 1; i > 0; i--) {
                    const p1 = this.body[i];
                    const p2 = this.body[i - 1];
                    currentPhysicalLength += Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (currentPhysicalLength > this.targetLength) {
                        cutIndex = i - 1;
                        break;
                    }
                }
                if (cutIndex !== -1 && cutIndex > 0) {
                    this.body.splice(0, cutIndex);
                }
            }

            draw() {
                const camX = camera.x;

                // Imunita po omráčení: blikání
                const blinking = this.immuneTime > 0 && !this.isStunned;
                ctx.globalAlpha = blinking && Math.floor(game.time * 8) % 2 === 0 ? 0.35 : 1;

                for (let i = 0; i < this.body.length; i++) {
                    const segment = this.body[i];
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    const segmentRadius = this.radius * (0.5 + (i / this.body.length) * 0.5);
                    ctx.arc(segment.x - camX, segment.y, segmentRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = this.headColor;
                ctx.beginPath();
                ctx.arc(this.x - camX, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - camX + Math.cos(this.currentMoveAngle - 0.5) * (this.radius * 0.6), this.y + Math.sin(this.currentMoveAngle - 0.5) * (this.radius * 0.6), 2, 0, Math.PI * 2);
                ctx.arc(this.x - camX + Math.cos(this.currentMoveAngle + 0.5) * (this.radius * 0.6), this.y + Math.sin(this.currentMoveAngle + 0.5) * (this.radius * 0.6), 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Efekty: zrychlení oranžový, zpomalení modrý obrys hlavy; omráčení hvězdičky
                if (this.boostTime > 0 || this.slowTime > 0) {
                    ctx.strokeStyle = this.boostTime > 0 ? '#FFA726' : '#4FC3F7';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x - camX, this.y, this.radius + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (this.isStunned) drawStunStars(this.x - camX, this.y, this.radius);
            }
        }

        // Odraz červa od kamenů (po normále elipsy)
        function bounceWormOffStones(worm, dt) {
            for (let i = 0; i < stones.length; i++) {
                const stone = stones[i];
                const maxR = Math.max(stone.rx, stone.ry);
                const distToCenter = Math.hypot(worm.x - stone.x, worm.y - stone.y);

                if (distToCenter > maxR + worm.radius) continue;

                const dx = worm.x - stone.x;
                const dy = worm.y - stone.y;

                const cosA = Math.cos(-stone.rotation);
                const sinA = Math.sin(-stone.rotation);

                const localX = dx * cosA - dy * sinA;
                const localY = dx * sinA + dy * cosA;

                const normalizedX = localX / (stone.rx + worm.radius);
                const normalizedY = localY / (stone.ry + worm.radius);
                const distanceSq = normalizedX * normalizedX + normalizedY * normalizedY;

                if (distanceSq <= 1) {
                    const normalLocalX = localX / (stone.rx * stone.rx);
                    const normalLocalY = localY / (stone.ry * stone.ry);

                    const normalGlobalX = normalLocalX * Math.cos(stone.rotation) - normalLocalY * Math.sin(stone.rotation);
                    const normalGlobalY = normalLocalX * Math.sin(stone.rotation) + normalLocalY * Math.cos(stone.rotation);

                    const bounceAngle = Math.atan2(normalGlobalY, normalGlobalX);

                    worm.angle = bounceAngle;
                    worm.currentMoveAngle = bounceAngle;

                    // Vytlačení o vzdálenost jednoho kroku základní rychlostí
                    const pushDist = worm.currentBaseSpeed * dt;
                    worm.x += Math.cos(bounceAngle) * pushDist;
                    worm.y += Math.sin(bounceAngle) * pushDist;
                }
            }
        }

        class Bug {
            constructor(x, y, rng) {
                const cfg = CONFIG.bug;
                this.x = x;
                this.y = y;

                // Náhodná velikostní kategorie; s tierByProgress je strop daný postupem mapou
                // (první pětina mapy jen kat. 1, poslední pětina kat. 1–5)
                const tierCount = CONFIG.tiers.sizes.length;
                const unlocked = cfg.tierByProgress
                    ? Math.max(1, Math.ceil((x / WORLD_WIDTH) * tierCount))
                    : tierCount;
                this.tier = Math.min(Math.floor(rng() * unlocked), tierCount - 1);   // 0-based index
                this.radius = tierRadius(this.tier);

                this.angle = rng() * Math.PI * 2;
                const look = cfg.tierLooks[this.tier];
                this.color = look.color;
                this.eyeColor = look.eye;
                this.speed = 0;            // px/s (počítá se v update)

                // AI: 'walk' / 'turn' řízené časovačem
                this.turnTimeLeft = 0;     // s
                this.turnRate = 0;         // rad/s

                this.isAwake = false;
                this.walkCycle = rng() * Math.PI * 2;

                // Stavové efekty ze střetů s červy (s)
                this.stunTime = 0;
                this.slowTime = 0;
                this.clashCooldown = new Map();   // worm → zbývající s
            }

            get isStunned() {
                return this.stunTime > 0;
            }

            tickEffects(dt) {
                this.stunTime = Math.max(0, this.stunTime - dt);
                this.slowTime = Math.max(0, this.slowTime - dt);
                for (const [worm, t] of this.clashCooldown) {
                    if (t - dt <= 0) this.clashCooldown.delete(worm);
                    else this.clashCooldown.set(worm, t - dt);
                }
            }

            update(dt, cameraX) {
                const cfg = CONFIG.bug;

                if (!this.isAwake) {
                    if (this.x < cameraX + CONFIG.view.width + cfg.wakeDistance) {
                        this.isAwake = true;
                    } else {
                        return;
                    }
                }

                this.tickEffects(dt);
                if (this.isStunned) {
                    this.speed = 0;
                    return;
                }

                // Vzorkování před hlavou brouka
                const s = cfg.sampling;
                const lookAheadDist = this.radius + s.ahead;
                let pathHitCount = 0;

                for (let i = 0; i < s.count; i++) {
                    const sampleAngleOffset = -s.spread + (s.spread * 2 * (i / (s.count - 1 || 1)));
                    const sampleAngle = this.angle + sampleAngleOffset;

                    const checkX = this.x + Math.cos(sampleAngle) * lookAheadDist;
                    const checkY = this.y + Math.sin(sampleAngle) * lookAheadDist;

                    if (checkX >= 0 && checkX < WORLD_WIDTH && checkY >= 0 && checkY < WORLD_HEIGHT) {
                        const pixel = tCtx.getImageData(checkX, checkY, 1, 1).data;
                        if (isPathColor(pixel[0], pixel[1], pixel[2])) {
                            pathHitCount++;
                        }
                    }
                }

                const pathPercentage = pathHitCount / s.count;
                this.speed = cfg.speed.dirt + (cfg.speed.tunnel - cfg.speed.dirt) * pathPercentage;
                if (this.slowTime > 0) this.speed *= CONFIG.clash.slow.factor;

                // AI: když nezatáčí, s danou pravděpodobností za sekundu začne zatáčet
                if (this.turnTimeLeft <= 0) {
                    const chanceThisStep = 1 - Math.exp(-cfg.turn.chancePerSec * dt);
                    if (Math.random() < chanceThisStep) {
                        this.turnTimeLeft = randRange(Math.random, cfg.turn.duration);
                        this.turnRate = (Math.random() * 2 - 1) * cfg.turn.maxRate;
                    }
                }
                if (this.turnTimeLeft > 0) {
                    this.angle += this.turnRate * dt;
                    this.turnTimeLeft -= dt;
                }

                this.walkCycle += cfg.walkAnim * dt;

                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;

                digTunnel(this.x, this.y, this.radius + cfg.digExtra);

                // Levý / pravý okraj světa – odraz
                if (this.x > WORLD_WIDTH) { this.x = WORLD_WIDTH; this.angle = Math.PI - this.angle; }
                if (this.x < 0) { this.x = 0; this.angle = Math.PI - this.angle; }

                // Horní / spodní okraj – stočí se vodorovně a klouže podél
                if (this.y < this.radius) {
                    this.y = this.radius;
                    this.angle = (Math.cos(this.angle) > 0) ? 0 : Math.PI;
                }
                if (this.y > WORLD_HEIGHT - this.radius) {
                    this.y = WORLD_HEIGHT - this.radius;
                    this.angle = (Math.cos(this.angle) > 0) ? 0 : Math.PI;
                }

                this.checkStoneCollision();
                this.checkRootCollision();
            }

            checkStoneCollision() {
                for (let i = 0; i < stones.length; i++) {
                    const stone = stones[i];
                    const maxR = Math.max(stone.rx, stone.ry);
                    const distToCenterSq = (this.x - stone.x) ** 2 + (this.y - stone.y) ** 2;
                    if (distToCenterSq > (maxR + this.radius) ** 2) continue;

                    const dx = this.x - stone.x;
                    const dy = this.y - stone.y;

                    const cosA = Math.cos(-stone.rotation);
                    const sinA = Math.sin(-stone.rotation);

                    const localX = dx * cosA - dy * sinA;
                    const localY = dx * sinA + dy * cosA;

                    const normalizedX = localX / (stone.rx + this.radius);
                    const normalizedY = localY / (stone.ry + this.radius);
                    const distanceSq = normalizedX * normalizedX + normalizedY * normalizedY;

                    if (distanceSq <= 1) {
                        const normalLocalX = localX / (stone.rx * stone.rx);
                        const normalLocalY = localY / (stone.ry * stone.ry);

                        const normalGlobalX = normalLocalX * Math.cos(stone.rotation) - normalLocalY * Math.sin(stone.rotation);
                        const normalGlobalY = normalLocalX * Math.sin(stone.rotation) + normalLocalY * Math.cos(stone.rotation);

                        const normalAngle = Math.atan2(normalGlobalY, normalGlobalX);

                        // Tečna, která lépe odpovídá dosavadnímu směru
                        const t1 = normalAngle + Math.PI / 2;
                        const t2 = normalAngle - Math.PI / 2;
                        const diff1 = Math.abs(Math.atan2(Math.sin(t1 - this.angle), Math.cos(t1 - this.angle)));
                        const diff2 = Math.abs(Math.atan2(Math.sin(t2 - this.angle), Math.cos(t2 - this.angle)));
                        this.angle = diff1 < diff2 ? t1 : t2;

                        // Mírně posunout ven, aby nezůstal zaseklý
                        this.x += Math.cos(normalAngle) * 1.5;
                        this.y += Math.sin(normalAngle) * 1.5;
                    }
                }
            }

            checkRootCollision() {
                for (let r = 0; r < rootsData.length; r++) {
                    const system = rootsData[r];
                    for (let s = 0; s < system.length; s++) {
                        const segment = system[s];

                        if (Math.abs(this.x - segment.x) > segment.radius + this.radius) continue;
                        if (Math.abs(this.y - segment.y) > segment.radius + this.radius) continue;

                        const dx = this.x - segment.x;
                        const dy = this.y - segment.y;
                        const distSq = dx * dx + dy * dy;
                        const minDist = segment.radius + this.radius;

                        if (distSq < minDist * minDist) {
                            const dist = Math.sqrt(distSq) || 0.0001;
                            const nx = dx / dist;
                            const ny = dy / dist;

                            const normalAngle = Math.atan2(ny, nx);
                            const t1 = normalAngle + Math.PI / 2;
                            const t2 = normalAngle - Math.PI / 2;
                            const diff1 = Math.abs(Math.atan2(Math.sin(t1 - this.angle), Math.cos(t1 - this.angle)));
                            const diff2 = Math.abs(Math.atan2(Math.sin(t2 - this.angle), Math.cos(t2 - this.angle)));
                            this.angle = diff1 < diff2 ? t1 : t2;

                            this.x = segment.x + nx * minDist;
                            this.y = segment.y + ny * minDist;
                        }
                    }
                }
            }

            draw() {
                const camX = camera.x;
                if (this.x + this.radius < camX || this.x - this.radius > camX + canvas.width) return;

                const drawX = this.x - camX;

                // Nohy
                ctx.strokeStyle = '#3E2723';
                ctx.lineWidth = Math.max(1.5, this.radius * 0.15);
                ctx.lineCap = 'round';
                const baseAngles = [Math.PI / 2.5, Math.PI / 2, Math.PI - Math.PI / 2.5];

                for (let i = 0; i < 3; i++) {
                    const wiggle = Math.sin(this.walkCycle + i) * 0.4;

                    const angleR = this.angle + baseAngles[i] + wiggle;
                    ctx.beginPath();
                    ctx.moveTo(drawX + Math.cos(this.angle + baseAngles[i]) * this.radius * 0.6,
                               this.y + Math.sin(this.angle + baseAngles[i]) * this.radius * 0.6);
                    ctx.lineTo(drawX + Math.cos(angleR) * this.radius * 1.4,
                               this.y + Math.sin(angleR) * this.radius * 1.4);
                    ctx.stroke();

                    const angleL = this.angle - baseAngles[i] - wiggle;
                    ctx.beginPath();
                    ctx.moveTo(drawX + Math.cos(this.angle - baseAngles[i]) * this.radius * 0.6,
                               this.y + Math.sin(this.angle - baseAngles[i]) * this.radius * 0.6);
                    ctx.lineTo(drawX + Math.cos(angleL) * this.radius * 1.4,
                               this.y + Math.sin(angleL) * this.radius * 1.4);
                    ctx.stroke();
                }

                // Kusadla
                ctx.strokeStyle = '#1a0f0a';
                ctx.lineWidth = Math.max(2, this.radius * 0.2);

                ctx.beginPath();
                ctx.moveTo(drawX + Math.cos(this.angle - 0.3) * this.radius * 0.9, this.y + Math.sin(this.angle - 0.3) * this.radius * 0.9);
                ctx.quadraticCurveTo(
                    drawX + Math.cos(this.angle - 0.6) * this.radius * 1.6, this.y + Math.sin(this.angle - 0.6) * this.radius * 1.6,
                    drawX + Math.cos(this.angle - 0.1) * this.radius * 1.4, this.y + Math.sin(this.angle - 0.1) * this.radius * 1.4
                );
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(drawX + Math.cos(this.angle + 0.3) * this.radius * 0.9, this.y + Math.sin(this.angle + 0.3) * this.radius * 0.9);
                ctx.quadraticCurveTo(
                    drawX + Math.cos(this.angle + 0.6) * this.radius * 1.6, this.y + Math.sin(this.angle + 0.6) * this.radius * 1.6,
                    drawX + Math.cos(this.angle + 0.1) * this.radius * 1.4, this.y + Math.sin(this.angle + 0.1) * this.radius * 1.4
                );
                ctx.stroke();

                // Tělo
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(drawX, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Oči
                ctx.fillStyle = this.eyeColor;
                ctx.beginPath();
                ctx.arc(drawX + Math.cos(this.angle - 0.4) * (this.radius * 0.6), this.y + Math.sin(this.angle - 0.4) * (this.radius * 0.6), this.radius * 0.15, 0, Math.PI * 2);
                ctx.arc(drawX + Math.cos(this.angle + 0.4) * (this.radius * 0.6), this.y + Math.sin(this.angle + 0.4) * (this.radius * 0.6), this.radius * 0.15, 0, Math.PI * 2);
                ctx.fill();

                if (this.slowTime > 0) {
                    ctx.strokeStyle = '#4FC3F7';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(drawX, this.y, this.radius + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (this.isStunned) drawStunStars(drawX, this.y, this.radius);
            }
        }

        // =====================================================================
        // ===== 6. GAME (reset, step, kamera, pravidla, střety) ===============
        // =====================================================================
        const camera = { x: 0 };

        const game = {
            seed: 0,
            playerCount: 1,
            time: 0,          // s – hodiny animací (běží vždy)
            phase: 'countdown',   // 'countdown' | 'race' | 'finished'
            countdown: 0,     // s do startu
            raceTime: 0,      // s od startu
            result: null,     // { winner, time, best, isRecord } po dojetí
            confetti: [],
            worms: [],
            bugs: [],
        };

        function getStartPositions(playerCount) {
            const p = CONFIG.players;
            const midY = WORLD_HEIGHT / 2;
            if (playerCount === 1) return [{ x: p.startX, y: midY }];
            return [
                { x: p.startX, y: midY - p.spacingY / 2 },
                { x: p.startX, y: midY + p.spacingY / 2 },
            ];
        }

        // Bezpečná zóna bez kamenů pokrývá starty pro 1 i 2 hráče,
        // takže stejný seed dá stejnou mapu bez ohledu na počet hráčů.
        function getAllStartPositions() {
            return [...getStartPositions(1), ...getStartPositions(2)];
        }

        function resetGame(seed, playerCount) {
            game.seed = seed;
            game.playerCount = playerCount;
            game.time = 0;
            game.phase = 'countdown';
            game.countdown = CONFIG.finish.countdown;
            game.raceTime = 0;
            game.result = null;
            game.confetti = [];
            camera.x = 0;

            const worldRng = mulberry32(seed);

            game.worms = getStartPositions(playerCount).map((p, i) => new Worm(p.x, p.y, PLAYER_COLORS[i]));

            clearTerrain();
            initStones(worldRng, getAllStartPositions());
            initRoots(worldRng);
            initBugs(worldRng);
            initCarrot(worldRng);

            syncUrl();
        }

        function syncUrl() {
            try {
                const params = new URLSearchParams(location.search);
                params.set('seed', game.seed);
                params.set('players', game.playerCount);
                history.replaceState(null, '', '?' + params.toString());
            } catch (e) {
                // file:// v některých prohlížečích nepovolí změnu URL – seed je vidět v HUD
            }
        }

        function handleActionKey(code) {
            if (code === 'KeyR') resetGame(game.seed, game.playerCount);       // stejná mapa
            if (code === 'KeyN') resetGame(newRandomSeed(), game.playerCount); // nová mapa
            if (code === 'Digit1') resetGame(game.seed, 1);
            if (code === 'Digit2') resetGame(game.seed, 2);
        }

        // Kamera sleduje vedoucího červa jen dopředu, nikdy necouvá
        function updateCamera(worms) {
            const triggerX = CONFIG.view.width * CONFIG.view.cameraTrigger;
            const leaderX = Math.max(...worms.map(w => w.x));
            if (leaderX - camera.x > triggerX) {
                camera.x = Math.min(leaderX - triggerX, WORLD_WIDTH - CONFIG.view.width);   // konec mapy
            }
        }

        // --- Střety červ ↔ brouk ---------------------------------------------

        // Kontakt brouka s červem: hlava má přednost před tělem.
        // Vrací { part: 'head' | 'body', x, y, r } (střed a rádius zasaženého kruhu) nebo null.
        function findContact(worm, bug) {
            const headDist = Math.hypot(bug.x - worm.x, bug.y - worm.y);
            if (headDist > worm.targetLength + worm.radius + bug.radius) return null;   // broad-phase

            if (headDist < worm.radius + bug.radius) {
                return { part: 'head', x: worm.x, y: worm.y, r: worm.radius };
            }

            // Tělo: bod s nejhlubším průnikem (normála pak míří od těla, ne podél něj)
            const len = worm.body.length;
            let best = null;
            let bestDepth = 0;
            for (let i = 0; i < len; i++) {
                const seg = worm.body[i];
                const segRadius = worm.radius * (0.5 + (i / len) * 0.5);   // jako ve Worm.draw()
                const depth = segRadius + bug.radius - Math.hypot(bug.x - seg.x, bug.y - seg.y);
                if (depth > bestDepth) {
                    bestDepth = depth;
                    best = { part: 'body', x: seg.x, y: seg.y, r: segRadius };
                }
            }
            return best;
        }

        // Vysune brouka ven z červa (po normále zasaženého kruhu, opakovaně kvůli sousedním bodům těla)
        function separateBug(bug, worm, contact) {
            for (let i = 0; i < 10 && contact; i++) {
                const dx = bug.x - contact.x;
                const dy = bug.y - contact.y;
                const dist = Math.hypot(dx, dy) || 0.0001;
                const minDist = contact.r + bug.radius + 0.5;
                bug.x = contact.x + (dx / dist) * minDist;
                bug.y = contact.y + (dy / dist) * minDist;
                contact = findContact(worm, bug);
            }
        }

        // Pravidla střetu podle kategorií; vrací true, pokud byl brouk sežrán
        function applyClash(worm, bug, contact) {
            const c = CONFIG.clash;
            const diff = worm.tier - bug.tier;   // > 0: červ je větší

            if (contact.part === 'head') {
                // Červ narazil do brouka
                if (diff > 0) {
                    const chance = c.eatGrowChance[Math.min(diff, c.eatGrowChance.length) - 1];
                    if (Math.random() < chance) worm.grow(bug.radius * c.eatGrowth);
                    else worm.boostTime = c.boost.duration;
                    worm.stats.eaten++;
                    return true;
                }
                if (diff === 0) worm.slowTime = c.slow.duration;
                else worm.stun();
            } else {
                // Brouk narazil do těla červa
                if (diff > 0) {
                    bug.stunTime = c.bugStun;
                } else if (diff === 0) {
                    worm.slowTime = c.slow.duration;
                    bug.slowTime = c.slow.duration;
                } else {
                    worm.grow(-c.bite * (tierRadius(1) - tierRadius(0)));
                    worm.stun();
                    worm.stats.bitten++;
                }
            }
            return false;
        }

        function resolveClashes() {
            const eaten = new Set();

            for (const worm of game.worms) {
                for (const bug of game.bugs) {
                    if (!bug.isAwake || eaten.has(bug) || bug.clashCooldown.has(worm)) continue;

                    const contact = findContact(worm, bug);
                    if (!contact) continue;

                    // Omráčený brouk do těla nenaráží
                    if (contact.part === 'body' && bug.isStunned) continue;

                    // Imunní červ může jen žrát; ostatní střety jen odsunou brouka
                    const isEat = contact.part === 'head' && worm.tier > bug.tier;
                    if (worm.immuneTime > 0 && !isEat) {
                        separateBug(bug, worm, contact);
                        continue;
                    }

                    if (applyClash(worm, bug, contact)) {
                        eaten.add(bug);
                    } else {
                        separateBug(bug, worm, contact);
                        bug.clashCooldown.set(worm, CONFIG.clash.pairCooldown);
                    }
                }
            }

            if (eaten.size > 0) game.bugs = game.bugs.filter(b => !eaten.has(b));
        }

        // --- Cíl, časomíra, rekord -------------------------------------------

        // Hlava se dotkne elipsy mrkve (normalizovaný test jako u kamenů)
        function touchesCarrot(worm) {
            const nx = (worm.x - carrot.x) / (carrot.rx + worm.radius);
            const ny = (worm.y - carrot.y) / (carrot.ry + worm.radius);
            return nx * nx + ny * ny <= 1;
        }

        function checkFinish() {
            const winner = game.worms.findIndex(touchesCarrot);   // při současném dojetí vyhrává nižší index
            if (winner !== -1) finishRace(winner);
        }

        function bestTimeKey() {
            return `wormRace.best.${game.seed}.${game.playerCount}`;
        }

        function loadBestTime() {
            try {
                const value = parseFloat(localStorage.getItem(bestTimeKey()));
                return Number.isFinite(value) ? value : null;
            } catch (e) {
                return null;   // bez úložiště (file:// v některých prohlížečích) se rekord nevede
            }
        }

        function saveBestTime(time) {
            try {
                localStorage.setItem(bestTimeKey(), String(time));
                return true;
            } catch (e) {
                return false;
            }
        }

        function finishRace(winner) {
            const worm = game.worms[winner];
            const time = game.raceTime;
            const previousBest = loadBestTime();
            const isRecord = (previousBest === null || time < previousBest) && saveBestTime(time);

            game.phase = 'finished';
            game.result = { winner, time, best: isRecord ? time : previousBest, isRecord };

            // Ukousnutí: místo zásahu na okraji mrkve směrem k hlavě
            const angle = Math.atan2(worm.y - carrot.y, worm.x - carrot.x);
            carrot.bite = { x: carrot.x + Math.cos(angle) * carrot.rx, y: carrot.y + Math.sin(angle) * carrot.ry, r: worm.radius };

            spawnConfetti();
        }

        // Konfety padají z horní části obrazovky (souřadnice obrazovky)
        function spawnConfetti() {
            const colors = ['#FF7043', '#FFCA28', '#66BB6A', '#42A5F5', '#AB47BC', '#EC407A'];
            game.confetti = [];
            for (let i = 0; i < CONFIG.finish.confetti; i++) {
                game.confetti.push({
                    x: Math.random() * CONFIG.view.width,
                    y: -Math.random() * CONFIG.view.height * 0.6,
                    vx: (Math.random() - 0.5) * 80,
                    vy: 120 + Math.random() * 160,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 10,
                    color: colors[i % colors.length],
                });
            }
        }

        function updateConfetti(dt) {
            for (const c of game.confetti) {
                c.x += c.vx * dt;
                c.y += c.vy * dt;
                c.angle += c.spin * dt;
                if (c.y > CONFIG.view.height + 10) c.y -= CONFIG.view.height + 20;   // dokola
            }
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const rest = seconds - minutes * 60;
            return `${minutes}:${rest.toFixed(2).padStart(5, '0')}`;
        }

        // Jeden simulační krok (dt v sekundách)
        function step(dt) {
            game.time += dt;

            if (game.phase === 'countdown') {
                game.countdown -= dt;
                if (game.countdown <= 0) game.phase = 'race';
                return;
            }
            if (game.phase === 'finished') {
                updateConfetti(dt);
                return;
            }

            game.raceTime += dt;

            game.worms.forEach((worm, i) => {
                const input = readInput(getControlsFor(i, game.playerCount));
                worm.update(dt, input, camera.x);
            });

            updateCamera(game.worms);

            for (let i = 0; i < game.bugs.length; i++) {
                game.bugs[i].update(dt, camera.x);
            }

            resolveClashes();
            checkFinish();
        }

        // =====================================================================
        // ===== 7. RENDER + HUD ===============================================
        // =====================================================================
        function drawStones() {
            const camX = camera.x;
            for (let i = 0; i < stones.length; i++) {
                const stone = stones[i];
                const maxDimension = Math.max(stone.rx, stone.ry);

                if (stone.x + maxDimension < camX || stone.x - maxDimension > camX + canvas.width) continue;

                const drawX = stone.x - camX;

                ctx.fillStyle = '#546E7A';
                ctx.beginPath();
                ctx.ellipse(drawX, stone.y, stone.rx, stone.ry, stone.rotation, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#37474F';
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.beginPath();
                const highlightOffsetX = -stone.rx * 0.2;
                const highlightOffsetY = -stone.ry * 0.2;
                const gx = highlightOffsetX * Math.cos(stone.rotation) - highlightOffsetY * Math.sin(stone.rotation);
                const gy = highlightOffsetX * Math.sin(stone.rotation) + highlightOffsetY * Math.cos(stone.rotation);
                ctx.ellipse(drawX + gx, stone.y + gy, stone.rx * 0.5, stone.ry * 0.5, stone.rotation, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRootsOverlay() {
            const camX = camera.x;
            for (let r = 0; r < rootsData.length; r++) {
                const system = rootsData[r];
                for (let s = 0; s < system.length; s++) {
                    const segment = system[s];

                    if (segment.x + segment.radius < camX || segment.x - segment.radius > camX + canvas.width) continue;

                    ctx.beginPath();
                    ctx.arc(segment.x - camX, segment.y, segment.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(62, 39, 35, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        }

        // Mrkev: oranžové tělo špičkou dolů, rýhy, zelená nať nahoře; po dojetí ukousnutá
        function drawCarrot() {
            const x = carrot.x - camera.x;
            const { y, rx, ry } = carrot;
            if (x + rx + 20 < 0 || x - rx - 20 > canvas.width) return;

            const topY = y - ry;

            // Nať
            ctx.fillStyle = '#43A047';
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.ellipse(x + i * rx * 0.45, topY - 14, 5, 16, i * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            // Tělo
            ctx.beginPath();
            ctx.moveTo(x - rx, topY + 6);
            ctx.quadraticCurveTo(x - rx * 0.8, y + ry * 0.3, x, y + ry);
            ctx.quadraticCurveTo(x + rx * 0.8, y + ry * 0.3, x + rx, topY + 6);
            ctx.quadraticCurveTo(x, topY - 6, x - rx, topY + 6);
            ctx.fillStyle = '#F57C00';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#BF360C';
            ctx.stroke();

            // Rýhy
            ctx.strokeStyle = 'rgba(191, 54, 12, 0.7)';
            for (let i = 1; i <= 4; i++) {
                const ly = topY + (ry * 2) * (i / 5);
                const halfWidth = rx * (1 - i / 5) * 0.6;
                ctx.beginPath();
                ctx.moveTo(x - halfWidth, ly);
                ctx.lineTo(x - halfWidth * 0.2, ly + 2);
                ctx.stroke();
            }

            if (carrot.bite) {
                ctx.fillStyle = CONFIG.colors.path;
                ctx.beginPath();
                ctx.arc(carrot.bite.x - camera.x, carrot.bite.y, carrot.bite.r * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Omráčení: 3 žluté tečky kroužící nad hlavou (x je už v souřadnicích obrazovky)
        function drawStunStars(x, y, radius) {
            ctx.fillStyle = '#FFEB3B';
            const orbit = radius + 6;
            for (let i = 0; i < 3; i++) {
                const a = game.time * 6 + i * (Math.PI * 2 / 3);
                ctx.beginPath();
                ctx.arc(x + Math.cos(a) * orbit, y - radius * 0.5 + Math.sin(a) * orbit * 0.4, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function wormEffectText(w) {
            if (w.isStunned) return ` · OMRÁČEN ${w.stunTime.toFixed(1)} s`;
            const parts = [];
            if (w.boostTime > 0) parts.push('ZRYCHLENÍ');
            if (w.slowTime > 0) parts.push('ZPOMALENÍ');
            return parts.length ? ' · ' + parts.join(' + ') : '';
        }

        function drawHud() {
            ctx.font = '16px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            game.worms.forEach((w, i) => {
                const progressText = w.isMaxTier ? 'MAX' : `${Math.floor(w.tierProgress * 100)} % k další`;
                ctx.fillText(
                    `P${i + 1} · Kat. ${w.tier + 1} (${progressText}) · Rádius: ${Math.round(w.radius)} | Rychlost: ${w.currentActualSpeed.toFixed(0)} / ${w.currentBoostSpeed.toFixed(0)} px/s · Sežráno: ${w.stats.eaten} · Ukousnuto: ${w.stats.bitten}${wormEffectText(w)}`,
                    20, 30 + i * 22
                );
            });

            ctx.textAlign = 'right';
            ctx.fillText(`Seed: ${game.seed} · Hráči: ${game.playerCount} · [R] restart · [N] nová mapa · [1/2] hráči`, canvas.width - 20, canvas.height - 15);   // dole – nahoře je dlouhý řádek hráče

            // Čas – vpravo nahoře (vlevo je řádek hráče)
            ctx.font = 'bold 32px Arial';
            ctx.fillText(formatTime(game.raceTime), canvas.width - 20, 40);
            ctx.textAlign = 'left';

            drawCountdown();
        }

        // Odpočet 3-2-1 a krátce po startu „START!“
        function drawCountdown() {
            let text = null;
            if (game.phase === 'countdown') text = String(Math.ceil(game.countdown));
            else if (game.phase === 'race' && game.raceTime < 0.7) text = 'START!';
            if (!text) return;

            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 8;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = text === 'START!' ? '#66BB6A' : '#FFCA28';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Oslavná zpráva: vítěz, čas, rekord, statistiky + konfety
        function drawFinishOverlay() {
            const result = game.result;
            if (!result) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const c of game.confetti) {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.angle);
                ctx.fillStyle = c.color;
                ctx.fillRect(-5, -3, 10, 6);
                ctx.restore();
            }

            const panelWidth = 640;
            const panelHeight = 300 + game.worms.length * 30;
            const px = (canvas.width - panelWidth) / 2;
            const py = (canvas.height - panelHeight) / 2;
            const cx = canvas.width / 2;

            ctx.fillStyle = 'rgba(30, 20, 15, 0.92)';
            ctx.fillRect(px, py, panelWidth, panelHeight);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#F57C00';
            ctx.strokeRect(px, py, panelWidth, panelHeight);

            ctx.textAlign = 'center';
            const winnerColors = PLAYER_COLORS[result.winner];
            ctx.font = 'bold 56px Arial';
            ctx.fillStyle = game.playerCount === 1 ? '#FFCA28' : winnerColors.head;
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            const title = game.playerCount === 1 ? 'CÍL! Mrkev je tvoje!' : `Hráč ${result.winner + 1} vyhrává!`;
            if (game.playerCount > 1) ctx.strokeText(title, cx, py + 75);
            ctx.fillText(title, cx, py + 75);

            ctx.font = 'bold 44px Arial';
            ctx.fillStyle = 'white';
            ctx.fillText(formatTime(result.time), cx, py + 140);

            ctx.font = 'bold 22px Arial';
            if (result.isRecord) {
                ctx.fillStyle = '#FFCA28';
                ctx.fillText('NOVÝ REKORD!', cx, py + 180);
            } else if (result.best !== null) {
                ctx.fillStyle = '#BDBDBD';
                ctx.fillText(`Rekord: ${formatTime(result.best)}`, cx, py + 180);
            }

            ctx.font = '18px Arial';
            game.worms.forEach((w, i) => {
                ctx.fillStyle = game.playerCount === 1 ? 'white' : (i === result.winner ? '#FFCA28' : '#BDBDBD');
                ctx.fillText(`P${i + 1} · Kat. ${w.tier + 1} · Sežráno: ${w.stats.eaten} · Ukousnuto: ${w.stats.bitten}`, cx, py + 225 + i * 30);
            });

            ctx.fillStyle = '#9E9E9E';
            ctx.fillText(`[R] znovu stejná mapa · [N] nová mapa · Seed ${game.seed}`, cx, py + panelHeight - 30);
            ctx.textAlign = 'left';
        }

        function render() {
            ctx.drawImage(
                terrainCanvas,
                camera.x, 0, canvas.width, canvas.height,
                0, 0, canvas.width, canvas.height
            );

            drawRootsOverlay();
            drawStones();
            drawCarrot();

            for (let i = 0; i < game.bugs.length; i++) {
                game.bugs[i].draw();
            }
            for (let i = 0; i < game.worms.length; i++) {
                game.worms[i].draw();
            }

            drawHud();
            if (game.phase === 'finished') drawFinishOverlay();
        }

        // =====================================================================
        // ===== 8. LOOP + BOOT ================================================
        // =====================================================================
        // Fixní simulační krok: logika běží vždy 60× za sekundu herního času,
        // vykreslování tak často, jak to monitor dovolí.
        const SIM_DT = 1 / CONFIG.sim.hz;
        let accumulator = 0;
        let lastTime = null;

        function frame(now) {
            if (lastTime === null) lastTime = now;
            accumulator += Math.min((now - lastTime) / 1000, CONFIG.sim.maxFrameTime);
            lastTime = now;

            while (accumulator >= SIM_DT) {
                step(SIM_DT);
                accumulator -= SIM_DT;
            }

            render();
            requestAnimationFrame(frame);
        }

        window.onload = function () {
            const params = new URLSearchParams(location.search);
            const seed = parseInt(params.get('seed'), 10) || newRandomSeed();
            const players = params.get('players') === '2' ? 2 : CONFIG.players.count;

            resetGame(seed, players);

            window.focus();
            canvas.setAttribute('tabindex', '0');
            canvas.focus();

            requestAnimationFrame(frame);
        };
    </script>
